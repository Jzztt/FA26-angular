<p>data-binding works!</p>

<p> {{ message }} </p>
<!-- FormsModule  -->
<input type="text" [(ngModel)]="message" />
<!--CommonModule  -->
<div *ngIf="isLogin; else logoutBlock">
     <p>Welcome back, user!</p>
</div>
<ng-template #logoutBlock>
     <p>You are logged out</p>
</ng-template>
<button class="bg-blue-500 rounded-full py-2 px-4" (click)="loginSystem()">
    {{ isLogin ? 'Logout' : 'Login' }}
</button>


<ul>
    <li *ngFor="let item of items">{{ item }}</li>
</ul>

<img [src]="imageUrl" alt="Angular Logo" width="100" height="100" />
